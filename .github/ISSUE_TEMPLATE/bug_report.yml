name: Relatar problema técnico
description: Relate um problema reproduzível neste repositório.
title: "[Problema]: "
labels: ["triagem"]
body:
  - type: markdown
    attributes:
      value: "Não inclua dados pessoais, credenciais, dados reais de processos ou informações internas. Para vulnerabilidades, use o canal privado de SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: O que aconteceu?
      description: Descreva o resultado observado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir?
      description: Use dados fictícios e passos mínimos.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que esperava que acontecesse?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Navegador, sistema ou versão relevante, sem identificadores pessoais.

