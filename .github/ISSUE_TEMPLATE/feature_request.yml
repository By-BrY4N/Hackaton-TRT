name: Propor melhoria
description: Sugira melhoria para o projeto ou materiais compartilhados.
title: "[Melhoria]: "
labels: ["ideia"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual necessidade isso atende?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Qual solução você sugere?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Beneficiados, riscos ou limitações
      description: Não compartilhe informações internas nem dados pessoais.

